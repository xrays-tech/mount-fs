[package]
name = "mount-fs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Mount cloud drives (Aliyun Drive, S3-compatible object storage) by orchestrating existing FUSE tools."
repository = "https://github.com/mount-fs/mount-fs"
readme = "README.md"
keywords = ["fuse", "mount", "cloud", "s3", "aliyun"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "mount_fs"
path = "src/lib.rs"

[[bin]]
name = "mount-fs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
etcetera = "0.8"
fs4 = "0.13"
rustix = { version = "1", features = ["process"] }
which = "7"
serde_json = "1.0.154"
dialoguer = "0.12.0"
semver = "1.0.28"
signal-hook = "0.4.6"
ureq = "3.5.2"
sha2 = "0.11.0"
flate2 = "1.1.11"
tar = "0.4.46"
zip = { version = "2", default-features = false, features = ["deflate"] }
xz2 = "0.1.7"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
